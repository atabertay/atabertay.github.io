- title: "Gender Inequality and Economic Growth: Evidence from Industry-Level Data"
  coauthors: "Ljubica Dordevic and Can Sever"
  journal: "Empirical Economics"
  venue: ", 2025, Vol. 68(5), 2291–2326"
  url: https://doi.org/10.1007/s00181-024-02698-6
  featured: true
  featured_order: 3
  short_venue: "Empirical Economics, 2025"
  summary: "Across manufacturing industries in 65 emerging and developing economies, lower gender inequality raises growth in female-intensive industries by about 26 percentage points over a decade."
  abstract: "This paper examines whether higher gender equality facilitates economic growth by enabling better utilization of female labor. By allocating female labor to its more productive use, we hypothesize that reducing gender inequality should disproportionately benefit industries with relatively higher female share in their employment. In a sample of manufacturing industries from 65 EMDEs over the period of 1990–2018, we find a positive growth differential of about 26 percentage points over a decade between industries with a high and low female share in employment when they are located in a low gender inequality country compared to a country with high gender inequality."
  links:
    - name: Journal version
      url: https://doi.org/10.1007/s00181-024-02698-6
    - name: Working paper (SSRN)
      url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=3658594

- title: "Are International Banks Different? Evidence on Bank Performance and Strategy"
  coauthors: "Aslı Demirgüç-Kunt and Harry Huizinga"
  journal: "Journal of Financial Services Research"
  venue: ", 2024, Vol. 66, 101–142"
  url: https://doi.org/10.1007/s10693-022-00390-3
  abstract: "This paper provides evidence on how bank performance and strategies vary with the degree of bank internationalization using data for 113 countries during 2000–15. Bank internationalization is associated with lower valuations and lower returns on equity. After the global financial crisis, international banks were revalued particularly if they had stable funding in the form of deposits and if they had more generous deposit insurance coverage. For international banks headquartered in developing countries, bank internationalization is related negatively with the cyclicality of their domestic credit growth with respect to home country GDP growth, smoothing local downturns. In contrast, if the international bank is from a high-income country investing in a developing country, its subsidiary bank lending is relatively procyclical, which can be destabilizing."
  links:
    - name: Journal version
      url: https://doi.org/10.1007/s10693-022-00390-3
    - name: VoxEU column
      url: https://voxeu.org/article/revaluation-international-banks-following-crisis

- title: "Bank Capital Regulation and Risk after the Global Financial Crisis"
  coauthors: "Deniz Anginer, Robert Cull, Aslı Demirgüç-Kunt and Davide S. Mare"
  journal: "Journal of Financial Stability"
  venue: ", 2024, Vol. 74, 100891"
  url: https://doi.org/10.1016/j.jfs.2021.100891
  abstract: "We explore and summarize the evolution in bank capital regulations and bank risk after the global financial crisis. Using a new survey of bank regulation and supervision covering more than 120 economies, we show that regulatory capital increased, but some elements of capital regulations became laxer. Analyzing bank-level data, we also document the importance of defining bank regulatory capital narrowly as the quality of capital matters in reducing bank risk. This is particularly true for banks that have more discretion in the computation of regulatory capital ratios and are subject to weaker market monitoring."
  links:
    - name: Journal version
      url: https://doi.org/10.1016/j.jfs.2021.100891

- title: "Leverage, Bank Employee Compensation and Institutions"
  coauthors: "Burak Uras"
  journal: "Journal of Banking and Finance"
  venue: ", 2020, Vol. 111, 105701"
  url: https://doi.org/10.1016/j.jbankfin.2019.105701
  abstract: "This paper investigates the empirical relationship between financial structure and employee compensation in the banking industry. Using an international panel of banks, we show that well-capitalized banks pay higher wages to their employees. Our results are robust to changes in measurement, model specification and estimation methods. In order to account for the positive association between bank capital and employee compensation, we illustrate a stylized 3-period model and show that well-capitalized banks have incentives to pay higher wages to induce monitoring. Such monitoring rents of employees at capitalized banks are expected to be higher in societies with weak institutions. Further empirical analysis shows that the weaker is institutional quality of a country the stronger is the positive relationship between bank capital and wages - supporting our theoretical conjectures."
  links:
    - name: Journal version
      url: https://doi.org/10.1016/j.jbankfin.2019.105701

- title: "Securitization and Economic Activity: The Credit Composition Channel"
  coauthors: "Di Gong and Wolf Wagner"
  journal: "Journal of Financial Stability"
  venue: ", 2017, Vol. 28, 225–239"
  url: https://www.sciencedirect.com/science/article/pii/S1572308916000115
  abstract: "Using an international panel of 104 countries over the period 1995 to 2012, we analyze the relationship between country-level securitization and economic activity. Our findings suggest that securitization is negatively related to various proxies of economic activity – even prior to the crisis of 2007-2009. We explain this finding as the results of securitization spurring consumption at the expense of investment and capital formation. Consistent with this, we find that securitization of household loans is negatively associated with economic activity, whereas business securitization displays a weak positive association with it, and that household securitization increases an economy's consumption-investment ratio. Our results inform recent initiatives aimed at reviving securitization markets, as they indicate that the impact of securitization crucially depends on the underlying collateral."
  links:
