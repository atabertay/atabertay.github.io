- title: "Decomposing the Finance Wage Premium: Contributions of Technology and Risk"
  coauthors: "José Gabriel Carreño, Harry Huizinga, Burak Uras and Nathanael Vellekoop"
  journal: "Journal of Corporate Finance"
  venue: ", 2026, Vol. 99, 102980"
  url: https://doi.org/10.1016/j.jcorpfin.2026.102980
  featured: true
  featured_order: 1
  short_venue: "Journal of Corporate Finance, 2026"
  summary: "Using Dutch worker–firm data, we show that IT investment, workforce education and their complementarity drive the finance wage premium; firm risk contributes little."
  abstract: "On average, wages in the finance industry are higher compared to the rest of the economy. Two explanations suggested for this finance wage premium are (1) the positive correlation between risk-taking and wages, and (2) industry differences in information technology intensity. Using a comprehensive worker-firm panel dataset for the Netherlands, we estimate wage models with additive worker and firm fixed effects, and compute the finance wage premium as the average of the firm fixed effects in an industry. We then relate the estimated cross-section of firm fixed effects to a range of firm characteristics, and find that information technology investment, the average level of educational attainment at a firm, and the complementarity of the two are the main drivers of the finance wage premium, while firm risk only makes a small contribution."
  links:
    - name: Journal version
      url: https://doi.org/10.1016/j.jcorpfin.2026.102980
    - name: Working paper (SSRN)
      url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5203539

