<script>
document.addEventListener('click', function (e) {
  var b = e.target.closest('.abs-toggle');
  if (!b) return;
  var box = document.getElementById(b.getAttribute('aria-controls'));
  var open = b.getAttribute('aria-expanded') === 'true';
  b.setAttribute('aria-expanded', String(!open));
  box.hidden = open;
});
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('a[href]').forEach(function (a) {
    var h = a.getAttribute('href');
    if (/\.pdf($|[?#])/i.test(h) || /^https?:/i.test(h)) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  var el = document.querySelector('.nav-footer-right');
  if (!el) return;
  var d = new Date(document.lastModified);
  if (!isNaN(d)) el.textContent = 'Last updated ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
});
</script>
